<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7ADAD">
<title>Guess It! Slang Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    /* พาเลตต์หลัก */
    --pink: #F29191;
    --pink-soft: #F7ADAD;
    --mint: #B1E5E6;
    --mint-soft: #CCFBFA;

    --bg: #fff7f7;
    --ink: #5a3d48;
    --muted: #a8838f;
    --line: #f9d3d3;
    --card: #ffffff;
    --accent: var(--pink);
    --accent-shadow: #d97878;
    --good: #5fc3c5;
    --good-bg: var(--mint-soft);
    --bad: var(--pink);
    --bad-bg: #fde8e8;
    --good-ink: #2f6f71;
    --bad-ink: #a2444f;
    --btn-ink: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Mali", -apple-system, BlinkMacSystemFont, "Sukhumvit Set", "Noto Sans Thai", "Leelawadee UI", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 12% 18%, var(--mint-soft) 0, transparent 32%),
      radial-gradient(circle at 88% 82%, var(--mint) 0, transparent 30%),
      radial-gradient(circle at 90% 10%, #fde3e3 0, transparent 28%),
      linear-gradient(160deg, #fff4f4 0%, #fdf9f9 50%, #effdfc 100%);
    background-attachment: fixed;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding: 56px 0 32px;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ตกแต่งพื้นหลัง: หัวใจ / ดาว / ดอกไม้ลอยไปมา */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
  .deco span { position: absolute; font-size: clamp(22px, 4vmin, 44px); opacity: .55; animation: float 6s ease-in-out infinite; }
  .deco span:nth-child(1) { top: 8%;  left: 6%;  color: var(--pink); }
  .deco span:nth-child(2) { top: 22%; right: 8%; color: var(--mint); animation-delay: -1.5s; }
  .deco span:nth-child(3) { bottom: 14%; left: 10%; color: var(--mint); animation-delay: -3s; }
  .deco span:nth-child(4) { bottom: 8%; right: 14%; color: var(--pink-soft); animation-delay: -4.5s; }
  .deco span:nth-child(5) { top: 52%; left: 3%; color: var(--pink-soft); animation-delay: -2s; font-size: clamp(16px, 2.6vmin, 28px); }
  .deco span:nth-child(6) { top: 60%; right: 4%; color: var(--pink); animation-delay: -5s; font-size: clamp(16px, 2.6vmin, 28px); }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-14px) rotate(6deg); }
  }

  .screen { display: none; width: min(92vw, 900px); text-align: center; }
  .screen.active { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Start */
  .logo {
    font-size: clamp(64px, 14vmin, 140px); line-height: 1;
    display: inline-grid; place-items: center;
    width: 1.6em; height: 1.6em; border-radius: 50%;
    background: var(--mint-soft); border: 4px dashed var(--mint);
    animation: bob 2.4s ease-in-out infinite;
  }
  .logo span { font-size: .8em; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 {
    font-family: "Poppins", "Mali", sans-serif;
    font-size: clamp(40px, 8vmin, 80px); font-weight: 800; letter-spacing: -0.01em; margin-top: 2vmin;
    color: var(--pink);
    text-shadow: 3px 3px 0 var(--mint), 6px 6px 0 rgba(177, 229, 230, .45);
  }
  .sub {
    display: inline-block;
    font-size: clamp(16px, 2.8vmin, 26px); font-weight: 600; color: var(--ink);
    margin-top: 1.5vmin; padding: .3em 1.1em; border-radius: 999px;
    background: var(--pink-soft); color: #fff;
  }
  .rules { display: flex; gap: 2vmin; justify-content: center; margin: 5vmin 0; flex-wrap: wrap; }
  .rule {
    background: var(--card); border: 3px solid var(--mint); border-radius: 22px;
    padding: 2vmin 3.2vmin; font-size: clamp(15px, 2.3vmin, 22px); font-weight: 500;
    box-shadow: 0 6px 0 var(--mint);
  }
  .rule:nth-child(2) { border-color: var(--pink-soft); box-shadow: 0 6px 0 var(--pink-soft); }
  .rule b { display: block; font-size: clamp(24px, 4vmin, 40px); color: var(--pink); }
  .rule:nth-child(2) b { color: var(--good); }

  .btn {
    font: inherit; cursor: pointer; border: none;
    background: var(--accent); color: var(--btn-ink);
    font-size: clamp(20px, 3.4vmin, 32px); font-weight: 700;
    padding: 2.2vmin 7vmin; border-radius: 999px;
    box-shadow: 0 6px 0 var(--accent-shadow), 0 10px 22px rgba(242, 145, 145, .35);
    text-shadow: 0 2px 0 rgba(170, 70, 70, .3);
    transition: transform .1s ease, box-shadow .1s ease, opacity .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-shadow), 0 4px 10px rgba(242, 145, 145, .3); }

  /* Question */
  .top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 3vmin;
    background: rgba(255, 255, 255, .7); border: 2px solid var(--line);
    border-radius: 999px; padding: 10px 20px;
  }
  .dots { display: flex; gap: 10px; }
  .dot { width: clamp(14px, 2vmin, 20px); height: clamp(14px, 2vmin, 20px); border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
  .dot.now { background: var(--pink-soft); transform: scale(1.3); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--pink-soft); }
  .dot.good { background: var(--good); }
  .dot.bad { background: var(--pink); }
  .score { font-size: clamp(18px, 2.8vmin, 26px); font-weight: 700; color: var(--pink); }
  .score span { color: var(--muted); font-weight: 500; }

  .emoji {
    font-size: clamp(64px, 13vmin, 140px); line-height: 1.1;
    display: inline-block; padding: .15em .45em; border-radius: 40px;
    background: var(--card); border: 3px dashed var(--pink-soft);
  }
  .prompt { font-size: clamp(24px, 4.6vmin, 46px); font-weight: 700; margin: 2.5vmin 0 4vmin; line-height: 1.35; }

  .options { display: grid; gap: 1.8vmin; }
  .opt {
    font: inherit; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 2.5vmin;
    background: var(--card); color: var(--ink);
    border: 3px solid var(--mint); border-radius: 22px;
    padding: 2.2vmin 3vmin;
    font-size: clamp(20px, 3.6vmin, 34px); font-weight: 600;
    box-shadow: 0 5px 0 var(--mint);
    transition: border-color .2s, background .2s, box-shadow .2s, transform .1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--pink); box-shadow: 0 5px 0 var(--pink-soft); transform: translateY(-2px); }
  .opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-soft); }
  .opt .key {
    flex: none; width: clamp(36px, 5.5vmin, 54px); height: clamp(36px, 5.5vmin, 54px);
    border-radius: 50%; background: var(--mint-soft); border: 2px solid var(--mint);
    display: grid; place-items: center; font-size: .8em; font-weight: 700; color: var(--good-ink);
  }
  .opt:nth-child(2) .key { background: #fdeaea; border-color: var(--pink-soft); color: var(--bad-ink); }
  .opt .mark { margin-left: auto; font-size: 1.1em; }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: .4; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); box-shadow: 0 5px 0 var(--good); }
  .opt.correct .key { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 5px 0 var(--bad); }
  .opt.wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }

  .feedback { min-height: clamp(130px, 22vmin, 220px); margin-top: 3vmin; display: flex; flex-direction: column; align-items: center; gap: 1.6vmin; }
  .fb-box { display: none; border-radius: 22px; padding: 2vmin 3vmin; font-size: clamp(17px, 2.8vmin, 26px); line-height: 1.45; max-width: 100%; border: 2px dashed transparent; }
  .fb-box.show { display: block; animation: fade .3s ease; }
  .fb-box.good { background: var(--good-bg); color: var(--good-ink); border-color: var(--good); }
  .fb-box.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--pink); }
  .fb-box b { font-weight: 700; }
  .next { display: none; }
  .next.show { display: inline-block; animation: fade .3s ease; }

  /* big tick / cross overlay */
  .stamp {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: clamp(140px, 34vmin, 320px); font-weight: 900; opacity: 0;
    text-shadow: 0 0 0 #fff, 6px 6px 0 rgba(255, 255, 255, .9);
  }
  .stamp.pop { animation: pop .8s ease forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4) rotate(-10deg); }
    30% { opacity: 1; transform: scale(1.1) rotate(4deg); }
    55% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* Result */
  .big { font-size: clamp(90px, 20vmin, 200px); line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  .final {
    display: inline-block;
    font-size: clamp(56px, 12vmin, 120px); font-weight: 800; margin-top: 2vmin;
    color: var(--pink); background: var(--card);
    padding: 0 .5em; border-radius: 40px; border: 4px solid var(--mint); box-shadow: 0 8px 0 var(--mint);
  }
  .final span { color: var(--muted); font-weight: 500; }
  .final span:first-child { color: var(--pink); font-weight: 800; }
  .verdict { font-size: clamp(26px, 5vmin, 48px); font-weight: 700; margin: 3vmin 0 1vmin; color: var(--pink); }
  .verdict.good { color: var(--good); }
  .note { font-size: clamp(16px, 2.6vmin, 24px); color: var(--muted); margin-bottom: 5vmin; }

  @media (max-width: 600px) {
    .opt { padding: 14px 16px; gap: 14px; }
    .rules { gap: 10px; }
    .rule { padding: 12px 14px; }
    .top { padding: 8px 14px; }
  }
  .btn-next {
    font-family: "Poppins", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: 0.22em;
    padding-left: calc(8vmin + 0.22em);
    padding-right: 8vmin;
  }
  .btn-next .arrow { display: inline-block; margin-left: .35em; letter-spacing: 0; transition: transform .2s; }
  .btn-next:hover .arrow { transform: translateX(4px); }
  .corner { position: fixed; bottom: 14px; right: 18px; font-size: 13px; color: var(--pink); background: #fff; border: 2px solid var(--pink-soft); border-radius: 999px; padding: 4px 12px; opacity: .85; }
  .corner:empty { display: none; }
  .fs { position: fixed; top: 14px; right: 18px; background: #fff; border: 2px solid var(--mint); color: var(--good-ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .fs:hover { background: var(--mint-soft); }
</style>
</head>
<body>

<div class="deco" aria-hidden="true"><span>♥</span><span>✿</span><span>★</span><span>♥</span><span>✦</span><span>✿</span></div>

<button class="fs" id="fsBtn" title="เต็มจอ (กด F)">⛶ เต็มจอ</button>

<!-- START -->
<section class="screen active" id="start">
  <div class="logo"><span>🎬</span></div>
  <h1>Guess It!</h1>
  <p class="sub">Idioms &amp; Slang Challenge</p>
  <div class="rules">
    <div class="rule"><b>5</b>คำถาม</div>
    <div class="rule"><b>A B C</b>เลือก 1 คำตอบ</div>
    <div class="rule"><b>3/5</b>ได้รับ Stamp</div>
  </div>
  <button class="btn" id="startBtn">เริ่มเกม ▶</button>
</section>

<!-- QUESTION -->
<section class="screen" id="quiz">
  <div class="top">
    <div class="dots" id="dots"></div>
    <div class="score">⭐ <span id="score">0</span><span> / 5</span></div>
  </div>
  <div class="emoji" id="emoji"></div>
  <div class="prompt" id="prompt"></div>
  <div class="options" id="options"></div>
  <div class="feedback">
    <div class="fb-box" id="fb"></div>
    <button class="btn next" id="nextBtn">ข้อต่อไป →</button>
  </div>
</section>

<!-- RESULT -->
<section class="screen" id="result">
  <div class="big" id="resEmoji"></div>
  <div class="final"><span id="resScore">0</span><span> / 5</span></div>
  <div class="verdict" id="resText"></div>
  <div class="note" id="resNote"></div>
  <button class="btn btn-next" id="againBtn">NEXT<span class="arrow">→</span></button>
</section>

<div class="stamp" id="stamp"></div>
<div class="corner" id="setLabel"></div>

<script>
/* ===== คลังคำถาม: 15 ชุด × 5 ข้อ × 3 ตัวเลือก (ตัวเลือกแรก = คำตอบที่ถูก, ระบบจะสลับตำแหน่งให้เอง) ===== */
const SETS = [
  [ // ชุด 1
    { e: "🍰", q: "“This test is a ___.”", o: ["piece of cake", "break a leg", "spill the tea"], m: "Piece of cake = ง่ายมาก ง่ายเหมือนกินเค้ก" },
    { e: "🤫☕", q: "“Come on, ___!”", o: ["spill the tea", "chill", "slay"], m: "Spill the tea = เล่าเรื่องเมาท์ / ข่าวเด็ดมาเลย" },
    { e: "🔥🎤", q: "“That concert was ___!”", o: ["lit", "sus", "salty"], m: "Lit = เจ๋งมาก สนุกสุด ๆ" },
    { e: "🎯🔨", q: "“You ___! That's exactly right.”", o: ["hit the nail on the head", "spilled the tea", "got cold feet"], m: "Hit the nail on the head = พูดถูกเป๊ะ ตรงประเด็น" },
    { e: "🤞🍀", q: "“Good luck on your exam! Fingers ___!”", o: ["crossed", "up", "down"], m: "Fingers crossed = ขอให้โชคดีนะ / ภาวนาให้สำเร็จ" },
  ],
  [ // ชุด 2
    { e: "🎭", q: "ก่อนเพื่อนขึ้นแสดง ควรพูดว่าอะไร?", o: ["Break a leg!", "Piece of cake!", "No cap!"], m: "Break a leg = ขอให้โชคดีนะ (ใช้อวยพรก่อนขึ้นแสดง)" },
    { e: "💅✨", q: "“You absolutely ___ that performance!”", o: ["slayed", "chilled", "ghosted"], m: "Slay = ทำได้ปังมาก เริ่ดมาก" },
    { e: "💔😭", q: "“After that sad ending, I was totally ___.”", o: ["heartbroken", "hyped", "salty"], m: "Heartbroken = อกหัก ใจสลาย" },
    { e: "🎶💥", q: "“This new song is a total ___!”", o: ["banger", "cringe", "ghost"], m: "Banger = เพลงปังมาก ฟังแล้วโยกตาม" },
    { e: "🎧🔁", q: "“I've had this song on ___ all day.”", o: ["repeat", "chill", "fire"], m: "On repeat = เปิดวนฟังซ้ำไม่หยุด" },
  ],
  [ // ชุด 3 — หนัง
    { e: "🍿👍", q: "“Best movie of the year, ___!”", o: ["no cap", "break a leg", "piece of cake"], m: "No cap = ไม่โม้ พูดจริง ๆ" },
    { e: "🤐🎬", q: "“Don't tell me the ending! No ___!”", o: ["spoilers", "cameos", "sequels"], m: "Spoiler = การเผยเนื้อเรื่อง / ตอนจบก่อนคนอื่นได้ดู" },
    { e: "😱🔄", q: "“The villain is his father?! What a ___!”", o: ["plot twist", "binge-watch", "cameo"], m: "Plot twist = เนื้อเรื่องหักมุม" },
    { e: "🌧️🎧🚶", q: "“Walking in the rain with music, I feel like the ___!”", o: ["main character", "villain", "audience"], m: "Main character (energy) = ฟีลเหมือนเป็นพระเอก/นางเอกในหนัง" },
    { e: "🎢😭😂", q: "“That movie was an emotional ___!”", o: ["rollercoaster", "piece of cake", "red flag"], m: "Emotional rollercoaster = อารมณ์ขึ้นลงสุด ๆ ทั้งหัวเราะทั้งร้องไห้" },
  ],
  [ // ชุด 4
    { e: "📺🛋️", q: "“I ___ the whole series in one weekend.”", o: ["binge-watched", "ghosted", "roasted"], m: "Binge-watch = ดูซีรีส์รวดเดียวหลาย ๆ ตอน" },
    { e: "😐🎬", q: "“The movie wasn't bad, but it was just ___.”", o: ["mid", "fire", "iconic"], m: "Mid = ธรรมดา ๆ กลาง ๆ ไม่ได้ว้าว" },
    { e: "🐐⚽", q: "“Messi is the ___!”", o: ["GOAT", "sus", "cringe"], m: "GOAT = Greatest Of All Time ที่สุดตลอดกาล" },
    { e: "🥔📺", q: "“My brother watches TV all day. He's a ___.”", o: ["couch potato", "GOAT", "main character"], m: "Couch potato = คนขี้เกียจที่นอนดูทีวีทั้งวัน" },
    { e: "🌶️💬", q: "“My ___: pineapple belongs on pizza!”", o: ["hot take", "cold feet", "plot twist"], m: "Hot take = ความเห็นแรง ๆ ที่หลายคนอาจไม่เห็นด้วย" },
  ],
  [ // ชุด 5 — ชีวิตประจำวัน
    { e: "👻📱", q: "“He stopped replying. He ___ me!”", o: ["ghosted", "roasted", "slayed"], m: "Ghost = หายเงียบ ไม่ตอบแชทไปเฉย ๆ" },
    { e: "🤨🔍", q: "“Why is he acting so weird? He's kinda ___.”", o: ["sus", "lit", "chill"], m: "Sus (suspicious) = น่าสงสัย ดูมีพิรุธ" },
    { e: "😬🙈", q: "“His dance video was so ___.”", o: ["cringe", "GOAT", "iconic"], m: "Cringe = น่าอาย ดูแล้วเขินแทน" },
    { e: "🚩😠", q: "“He never says sorry. That's a ___.”", o: ["red flag", "green light", "piece of cake"], m: "Red flag = สัญญาณอันตราย นิสัยที่ควรระวัง" },
    { e: "😏💘", q: "“He got her number in five minutes. He has so much ___!”", o: ["rizz", "tea", "FOMO"], m: "Rizz = เสน่ห์ ความสามารถในการจีบ" },
  ],
  [ // ชุด 6
    { e: "🧂😤", q: "“She lost the game, and now she's ___.”", o: ["salty", "chill", "lit"], m: "Salty = หงุดหงิด งอน ขุ่นเคือง" },
    { e: "😎🌴", q: "“Relax, just ___!”", o: ["chill", "spill the tea", "ghost"], m: "Chill = ใจเย็น ๆ ชิล ๆ ผ่อนคลาย" },
    { e: "🔥🎙️", q: "“The comedian ___ him so hard!”", o: ["roasted", "binged", "ghosted"], m: "Roast = แซวแรง ๆ ล้อเลียนแบบขำ ๆ" },
    { e: "🎭🙄", q: "“Wearing a ball gown to the cinema? You're so ___!”", o: ["extra", "mid", "sus"], m: "Extra = เว่อร์ เกินเบอร์ ทำเกินจำเป็น" },
    { e: "🧢🤥", q: "“He said he had dinner with BTS? That's ___!”", o: ["cap", "lit", "iconic"], m: "Cap = โม้ โกหก (ตรงข้ามกับ no cap)" },
  ],
  [ // ชุด 7 — Idioms
    { e: "🌧️🐱🐶", q: "“It's raining ___!”", o: ["cats and dogs", "piece of cake", "break a leg"], m: "Raining cats and dogs = ฝนตกหนักมาก" },
    { e: "🧊🔨", q: "“Let's play a game to ___ with new friends.”", o: ["break the ice", "spill the tea", "call it a day"], m: "Break the ice = ละลายพฤติกรรม ทำให้บรรยากาศไม่เกร็ง" },
    { e: "🌕💙", q: "“I go to the cinema once in a ___.”", o: ["blue moon", "piece of cake", "cold feet"], m: "Once in a blue moon = นาน ๆ ครั้ง" },

/* ===== สุ่มชุดแบบไม่ซ้ำจนกว่าจะครบทุกชุด (จำข้ามการรีเฟรชหน้า) ===== */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nextSetIndex() {
  let bag = [];
  try { bag = JSON.parse(localStorage.getItem("guessit_bag_v15") || "[]"); } catch (e) {}
  if (!bag.length) {
    let last = Number(localStorage.getItem("guessit_last_v15"));
    bag = shuffle(SETS.map((_, i) => i));
    if (bag[0] === last && bag.length > 1) bag.push(bag.shift()); // กันชุดเดิมซ้ำติดกัน
  }
  const idx = bag.shift();
  try { localStorage.setItem("guessit_bag_v15", JSON.stringify(bag)); localStorage.setItem("guessit_last_v15", idx); } catch (e) {}
  return idx;
}

/* ===== Game ===== */
const PASS_SCORE = 3; // ตอบถูกกี่ข้อถึงได้ Stamp
const $ = id => document.getElementById(id);
let questions = [], qi = 0, score = 0, results = [], answered = false, setNo = 0;

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id)); }

function startGame() {
  setNo = nextSetIndex();
  questions = SETS[setNo];
  qi = 0; score = 0; results = [];
  $("setLabel").textContent = "ชุดที่ " + (setNo + 1);
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[qi];
  answered = false;
  $("score").textContent = score;
  $("dots").innerHTML = questions.map((_, i) =>
    `<div class="dot ${results[i] === true ? "good" : results[i] === false ? "bad" : i === qi ? "now" : ""}"></div>`).join("");
  $("emoji").textContent = q.e;
  $("prompt").textContent = q.q;
  const opts = shuffle(q.o.map((t, i) => ({ t, ok: i === 0 })));
  $("options").innerHTML = "";
  opts.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.dataset.ok = op.ok;
    b.innerHTML = `<span class="key">${"ABC"[i]}</span><span>${op.t}</span><span class="mark"></span>`;
    b.onclick = () => answer(b);
    $("options").appendChild(b);
  });
  $("fb").className = "fb-box";
  $("nextBtn").className = "btn next";
  $("nextBtn").textContent = qi < questions.length - 1 ? "ข้อต่อไป →" : "ดูผลคะแนน →";
}

function answer(btn) {
  if (answered) return;
  answered = true;
  const q = questions[qi];
  const ok = btn.dataset.ok === "true";
  const all = [...$("options").children];
  const correctBtn = all.find(b => b.dataset.ok === "true");
  all.forEach(b => { b.disabled = true; if (b !== btn && b !== correctBtn) b.classList.add("dim"); });

  correctBtn.classList.add("correct");
  correctBtn.querySelector(".mark").textContent = "✅";
  if (ok) {
    score++;
    $("score").textContent = score;
    popStamp("✓", "var(--good)");
    $("fb").innerHTML = `ถูกต้อง! 🎉<br><b>${q.m}</b>`;
    $("fb").className = "fb-box good show";
  } else {
    btn.classList.add("wrong");
    btn.querySelector(".mark").textContent = "❌";
    popStamp("✗", "var(--bad)");
    $("fb").innerHTML = `เฉลย: <b>${q.o[0]}</b><br>${q.m}`;
    $("fb").className = "fb-box bad show";
  }
  results[qi] = ok;
  $("dots").children[qi].className = "dot " + (ok ? "good" : "bad");
  setTimeout(() => $("nextBtn").classList.add("show"), 450);
}

function popStamp(ch, color) {
  const s = $("stamp");
  s.textContent = ch; s.style.color = color;
  s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
}

function next() {
  if (!answered) return;
  qi++;
  if (qi < questions.length) renderQuestion(); else showResult();
}

function showResult() {
  $("resScore").textContent = score;
  const pass = score >= PASS_SCORE;
  $("resEmoji").textContent = score === questions.length ? "🏆" : pass ? "🎉" : "💪";
  $("resText").textContent = score === questions.length ? "Perfect! เต็ม " + questions.length + " คะแนน" : pass ? "ผ่าน! เก่งมาก" : "เกือบแล้ว!";
  $("resText").className = "verdict" + (pass ? " good" : "");
  $("resNote").textContent = pass ? "รับ Stamp ได้ที่เจ้าหน้าที่เลย ✨" : "ลองใหม่อีกครั้งนะ ได้โจทย์ชุดใหม่แน่นอน";
  show("result");
}

/* ===== Controls ===== */
$("startBtn").onclick = startGame;
$("nextBtn").onclick = next;
$("againBtn").onclick = () => { show("start"); $("setLabel").textContent = ""; };

function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
$("fsBtn").onclick = toggleFS;
if (!document.documentElement.requestFullscreen) $("fsBtn").style.display = "none"; // iPhone ไม่รองรับ

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "f") return toggleFS();
  const active = document.querySelector(".screen.active").id;
  if (active === "start" && (k === "enter" || k === " ")) return startGame();
  if (active === "result" && (k === "enter" || k === " ")) return $("againBtn").click();
  if (active === "quiz") {
    const map = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2 };
    if (k in map && !answered) $("options").children[map[k]].click();
    else if ((k === "enter" || k === " " || k === "arrowright") && answered) next();
  }
});
